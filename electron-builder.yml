appId: local.pip.desktop
productName: Pip
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: build/icon.png
    to: icon.png
win:
  target: nsis
  icon: build/icon.png
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
publish: null
